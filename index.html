<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dylan - Mi Primer Año</title>
    
    <!-- Metas para redes sociales -->
    <meta property="og:title" content="Dylan - Mi Primer Año">
    <meta property="og:description" content="¡Estás invitado al 1° año de Dylan!">
    <meta property="og:image" content="https://raw.githubusercontent.com/DISENO-Perzonaliza-y-Crea/Dylan-mi-1-a-o/main/portada.png">
    <meta property="og:type" content="website">
    
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body { font-family: 'Inter', sans-serif; }
        .img-block { display: block; line-height: 0; width: 100%; }
        img { display: block; width: 100%; height: auto; }
        .fixed-btn { 
            position: absolute; 
            z-index: 50; 
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            cursor: pointer;
            user-select: none;
        }
        
        @keyframes pulse-soft {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .animate-pulse-soft {
            animation: pulse-soft 2s infinite;
        }
    </style>
</head>
<body class="bg-blue-900 text-slate-900 min-h-screen flex flex-col items-center justify-start py-0 sm:py-6">

    <!-- Pantalla de Bienvenida para permitir la reproducción de sonido en navegadores móviles -->
    <div id="welcome-overlay" class="fixed inset-0 z-50 bg-blue-950/90 backdrop-blur-md flex flex-col items-center justify-center p-4 transition-opacity duration-500">
        <div class="bg-white rounded-3xl p-8 max-w-sm w-full text-center shadow-2xl border-4 border-amber-400">
            <div class="w-20 h-20 bg-amber-100 rounded-full flex items-center justify-center mx-auto mb-4 text-amber-600 text-4xl animate-pulse-soft">
                🎵
            </div>
            <h2 class="text-2xl font-bold text-slate-800 mb-2">¡Invitación Especial!</h2>
            <p class="text-slate-600 mb-6 text-sm">Estás invitado a celebrar el 1° año de <strong>Dylan</strong> 🎉</p>
            <button id="enter-btn" class="w-full bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-600 hover:to-orange-600 text-white font-bold py-4 px-6 rounded-full text-lg shadow-lg transform transition active:scale-95 animate-pulse-soft">
                ✉️ Ver Invitación
            </button>
        </div>
    </div>

    <!-- Elemento de Audio optimizado con servidor CDN jsDelivr -->
    <audio id="bg-music" loop preload="auto">
        <source src="https://cdn.jsdelivr.net/gh/DISENO-Perzonaliza-y-Crea/Dylan-mi-1-a-o@main/Alboroto%20en%20La%20Granja%20-%20La%20Granja%20de%20Zen%C3%B3n%205%20_%20El%20Reino%20Infantil.mp3" type="audio/mpeg">
        <source src="https://raw.githubusercontent.com/DISENO-Perzonaliza-y-Crea/Dylan-mi-1-a-o/main/Alboroto%20en%20La%20Granja%20-%20La%20Granja%20de%20Zen%C3%B3n%205%20_%20El%20Reino%20Infantil.mp3" type="audio/mpeg">
        Tu navegador no soporta el reproductor de audio.
    </audio>

    <!-- Control Discreto de Silencio -->
    <button id="mute-toggle" class="fixed top-4 right-4 z-40 bg-white/80 backdrop-blur-md border border-slate-200 text-slate-800 p-3 rounded-full shadow-md text-sm font-semibold flex items-center gap-2 hover:bg-white transition hidden">
        <span id="mute-icon">🔊</span>
    </button>

    <div class="w-full max-w-xl mx-auto relative bg-slate-50 shadow-2xl rounded-none sm:rounded-2xl overflow-hidden" id="main-container">
        <!-- Página 1 -->
        <div class="img-block">
            <img src="https://raw.githubusercontent.com/DISENO-Perzonaliza-y-Crea/Dylan-mi-1-a-o/main/1.png" alt="Página 1">
        </div>
        
        <!-- Página 2 -->
        <div class="img-block relative">
            <img src="https://raw.githubusercontent.com/DISENO-Perzonaliza-y-Crea/Dylan-mi-1-a-o/main/2.png" alt="Página 2">
            <a href="https://www.google.com/maps/place/Sal%C3%B3n+de+eventos+Villa+higuera/@19.2299432,-103.7662127,17z/data=!3m1!4b1!4m6!3m5!1s0x84254f001708580d:0x8d7fac1690f5fdbd!8m2!3d19.2299432!4d-103.7662127!16s%2Fg%2F11xyl6xv22!18m1!1e1" 
               target="_blank"
               class="fixed-btn bg-orange-500 text-white font-bold rounded-full shadow-lg hover:bg-orange-600 transition text-xl"
               style="left: 161px; top: 574px; width: 264px; height: 80px;">
                📍 Ver Ubicación
            </a>
        </div>
        
        <!-- Página 3 -->
        <div class="img-block">
            <img src="https://raw.githubusercontent.com/DISENO-Perzonaliza-y-Crea/Dylan-mi-1-a-o/main/3.png" alt="Página 3">
        </div>
        
        <!-- Página 4 -->
        <div class="img-block relative">
            <img src="https://raw.githubusercontent.com/DISENO-Perzonaliza-y-Crea/Dylan-mi-1-a-o/main/4.png" alt="Página 4">
            <button onclick="sendRSVP()" 
                class="fixed-btn bg-orange-500 text-white font-bold rounded-full shadow-lg hover:bg-orange-600 transition text-xl"
                style="left: 171px; top: 214px; width: 230px; height: 80px;">
                Confirmar Asistencia
            </button>
        </div>
    </div>

    <script>
        const audio = document.getElementById('bg-music');
        const overlay = document.getElementById('welcome-overlay');
        const enterBtn = document.getElementById('enter-btn');
        const muteToggle = document.getElementById('mute-toggle');
        const muteIcon = document.getElementById('mute-icon');

        // Inicia el audio y oculta la ventana emergente
        function startExperience() {
            audio.play().then(() => {
                console.log("Audio reproduciendo con éxito");
            }).catch(error => {
                console.log("Error al reproducir audio:", error);
            });

            overlay.style.opacity = '0';
            setTimeout(() => {
                overlay.style.display = 'none';
                muteToggle.classList.remove('hidden');
            }, 500);
        }

        enterBtn.addEventListener('click', startExperience);

        // Respaldo en caso de toque fuera del botón
        function fallbackStart() {
            if (audio.paused) {
                startExperience();
            }
            document.removeEventListener('click', fallbackStart);
            document.removeEventListener('touchstart', fallbackStart);
        }

        document.addEventListener('click', fallbackStart);
        document.addEventListener('touchstart', fallbackStart);

        // Control de Silencio
        muteToggle.addEventListener('click', () => {
            if (audio.paused) {
                audio.play();
                muteIcon.textContent = '🔊';
            } else {
                audio.pause();
                muteIcon.textContent = '🔇';
            }
        });

        // Enviar WhatsApp
        function sendRSVP() {
            const message = encodeURIComponent(`¡Hola! Confirmo mi asistencia al 1° año de Dylan.`);
            window.open(`https://wa.me/523124154011?text=${message}`, '_blank');
        }
    </script>
</body>
</html>
